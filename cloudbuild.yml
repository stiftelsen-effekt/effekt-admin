steps:
  - id: "install"
    name: "node:24.22.1"
    entrypoint: "npm"
    args: ["ci"]

  - id: "type-check"
    name: "node:24.22.1"
    entrypoint: "npm"
    args: ["run", "typecheck"]

  - id: "test"
    name: "node:24.22.1"
    entrypoint: "npm"
    env: ["CI=true"]
    args: ["run", "test"]

options:
  logging: CLOUD_LOGGING_ONLY
